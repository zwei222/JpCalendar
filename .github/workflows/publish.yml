name: Publish NuGet.org

# Publishes the package that is built from main. The version is the one declared in
# src/JpCalendar/JpCalendar.csproj, so a push to main publishes a new version only when
# that version changes; --skip-duplicate keeps later pushes to main green.

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  TARGET_PROJECT: ./src/JpCalendar/JpCalendar.csproj
  TEST_PROJECT: ./tests/JpCalendar.Test/JpCalendar.Test.csproj
  CONFIGURATION: Release
  DOTNET_VERSION: 11.0.100
  OUTPUT_DIR: ./nuget

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Install dependencies
      run: dotnet restore ${{ env.TARGET_PROJECT }}

    - name: Test
      run: dotnet test ${{ env.TEST_PROJECT }} --configuration ${{ env.CONFIGURATION }}

    - name: Pack
      run: dotnet pack ${{ env.TARGET_PROJECT }} --configuration ${{ env.CONFIGURATION }} --output ${{ env.OUTPUT_DIR }}

    - name: Verify the packed package
      id: package
      run: |
        set -euo pipefail
        shopt -s nullglob
        packages=("${OUTPUT_DIR}"/JpCalendar.*.nupkg)
        if (( ${#packages[@]} != 1 )); then
          echo "Expected exactly one JpCalendar package, found ${#packages[@]}." >&2
          ls -1 "${OUTPUT_DIR}" >&2
          exit 1
        fi
        package="${packages[0]}"
        version="${package##*/JpCalendar.}"
        version="${version%.nupkg}"
        [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
        unzip -p "${package}" JpCalendar.nuspec | grep -Fq "<version>${version}</version>"
        echo "Packing version ${version} from ${package}"
        printf 'version=%s\npath=%s\n' "${version}" "${package}" >> "${GITHUB_OUTPUT}"

    - name: Publish
      env:
        PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        PACKAGE_PATH: ${{ steps.package.outputs.path }}
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      run: |
        set -euo pipefail
        echo "Publishing JpCalendar ${PACKAGE_VERSION}"
        dotnet nuget push "${PACKAGE_PATH}" --api-key "${NUGET_API_KEY}" --source https://api.nuget.org/v3/index.json --skip-duplicate
